 <!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bruna Tavares Marmita</title>
<style>
:root{--a:#0b57d0;--bg:#eef3fb;--t:#12233d}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--t);padding-bottom:90px}
header{background:var(--a);color:#fff;padding:14px;text-align:center}
header img{width:96px;height:96px;border-radius:50%;border:4px solid #fff;background:#fff}
header h1{margin:6px 0 0;font-size:22px}.st{display:inline-block;margin-top:6px;padding:3px 12px;border-radius:99px;font-size:13px;font-weight:700}
.on{background:#1db954}.off{background:#d93025}
main{max-width:640px;margin:auto;padding:12px}
h2{margin:18px 0 8px;color:var(--a);font-size:19px}
.c{background:#fff;border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 1px 4px #0002;position:relative}
.c img{width:100%;max-height:200px;object-fit:cover;border-radius:10px}
.c img.bi{width:56px;height:56px;max-height:56px;object-fit:contain;flex:0 0 56px;background:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.row button{flex:1}
button,.btn{background:var(--a);color:#fff;border:2px solid var(--a);border-radius:10px;padding:10px 14px;font-size:15px;font-weight:600;text-decoration:none;display:inline-block;cursor:pointer}
button.s,.btn.s{background:#fff;color:var(--a)}button.r{background:#d93025;border-color:#d93025}button:disabled{background:#999;border-color:#999;color:#fff;cursor:not-allowed}
input,textarea{width:100%;padding:10px;margin:4px 0;border:1px solid #bbc;border-radius:8px;font-size:15px}
input[type=checkbox],input[type=radio]{width:auto;margin:0}
.f{display:block;font-size:13px;margin-top:6px}
.rd{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:15px}
.tag{position:absolute;top:18px;right:18px;background:#d93025;color:#fff;padding:4px 10px;border-radius:8px;font-weight:700}
.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:10px;box-shadow:0 -2px 8px #0003;text-align:center}
.bar button{width:100%;max-width:640px}
.q{display:flex;align-items:center;gap:10px;justify-content:space-between;margin:6px 0}
.q button{padding:4px 12px}
</style></head><body>
<header><img src="logo.png" alt="" onerror="this.style.display='none'"><h1>Bruna Tavares Marmita</h1><div id="st" class="st"></div></header>
<div id="demo" style="display:none;background:#fff3cd;color:#664d03;padding:8px;text-align:center;font-size:13px">MODO TESTE: nada fica salvo. Área do dono: qualquer e-mail e senha.</div>
<main id="app"></main><div id="bar" class="bar"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const FB={
apiKey:"AIzaSyCPWL0ESUSCIRoQGnSQSYpbc8kzPcfZjrc",
authDomain:"marmita-ef649.firebaseapp.com",
projectId:"marmita-ef649",
appId:"1:129182915229:web:1b6f28b042bb9d4884d274"};
const demo=FB.apiKey=="COLE_AQUI";
let auth,ref;
if(demo){let _a=()=>{},_s=()=>{};
auth={onAuthStateChanged(f){_a=f;f(null)},signInWithEmailAndPassword(){setTimeout(()=>_a({}));return Promise.resolve()},signOut(){_a(null)},sendPasswordResetEmail:()=>Promise.resolve()};
ref={onSnapshot(f){_s=f;f({exists:false})},set(d){_s({exists:true,data:()=>d});return Promise.resolve()}};
document.getElementById("demo").style.display="block"}
else{firebase.initializeApp(FB);auth=firebase.auth();ref=firebase.firestore().doc("config/menu")}
const CATS=[["espetinhos","Espetinhos","Nome do espetinho","+ Espetinho"],["assados","Assados de domingo","Nome do assado","+ Assado"]];
const DEF={opcoes:[],espetinhos:[],assados:[],precos:{P:0,M:0,G:0},taxa:6,pagamentos:"Pix, Dinheiro, Cartão de crédito, Cartão de débito",pix:"",
bebidas:[{id:"b1",nome:"Coca-Cola 2L",preco:14,esgotado:false},{id:"b2",nome:"Guariti 2L",preco:10,esgotado:false},{id:"b3",nome:"Coca-Cola lata",preco:6,esgotado:false},{id:"b4",nome:"Guaraná lata",preco:6,esgotado:false},{id:"b5",nome:"Água",preco:3,esgotado:false}],
whatsapp:"5517991337756",endereco:"R. Cristóvão Colombo, 1460 - Vila Maceno, São José do Rio Preto - SP, 15055-000",abre:"00:00",fecha:"23:59"};
if(demo){DEF.precos={P:15,M:18,G:22};DEF.opcoes=[{id:"m1",nome:"Frango grelhado",desc:"Arroz, feijão, salada e farofa"},{id:"m2",nome:"Bife acebolado",desc:"Arroz, feijão, purê e salada"},{id:"m3",nome:"Strogonoff",desc:"Arroz, batata palha e salada"}];DEF.espetinhos=[{id:"e1",nome:"Espetinho de carne",desc:"Com farofa e vinagrete",preco:8}];DEF.assados=[{id:"a1",nome:"Frango assado inteiro",desc:"Com farofa",preco:45}]}
const TN={P:"Pequena",M:"Média",G:"Grande"};
let M=DEF,E=null,cart={},view="loja",user=null,editEnd=false,modo="retirada",tam="",pag=null,troco="",obs="";
let cli=JSON.parse(localStorage.getItem("cli")||"{}");
const $=s=>document.querySelector(s),R=n=>"R$ "+Number(n||0).toFixed(2).replace(".",",");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const endTxt=e=>e&&e.rua?`${e.rua}, ${e.num} - ${e.bairro}${e.comp?" ("+e.comp+")":""}${e.ref?" | Ref: "+e.ref:""}`:"";
const L=(id,t,v,ty="text")=>`<label class="f">${t}<input id="${id}" type="${ty}" value="${esc(v)}"></label>`;
const aberto=()=>{const d=new Date(),m=d.getHours()*60+d.getMinutes(),p=h=>{const[a,b]=h.split(":");return a*60+ +b};return m>=p(M.abre)&&m<=p(M.fecha)};
ref.onSnapshot(d=>{M=d.exists?{...DEF,...d.data()}:DEF;if(view!="admin")render()},()=>render());
auth.onAuthStateChanged(u=>{user=u;if(!u&&view=="admin")view="loja";render()});
function addM(i){const m=M.opcoes[i];if(!tam||m.esgotado)return;const k=m.id+tam;cart[k]=cart[k]||{nome:`Marmita ${TN[tam]} - ${m.nome}`,preco:+M.precos[tam]||0,q:0};cart[k].q++;render()}
function addB(i){const b=M.bebidas[i];if(b.esgotado)return;cart[b.id]=cart[b.id]||{nome:b.nome,preco:+b.preco||0,q:0};cart[b.id].q++;render()}
function addX(k,i){const b=M[k][i];if(b.esgotado)return;cart[b.id]=cart[b.id]||{nome:b.nome,preco:+b.preco||0,q:0};cart[b.id].q++;render()}
function mud(k,d){cart[k].q+=d;if(cart[k].q<1)delete cart[k];render()}
const sub=()=>Object.values(cart).reduce((s,i)=>s+i.q*i.preco,0);
const taxa=()=>modo=="entrega"?Number(M.taxa)||0:0;
const pgs=()=>String(M.pagamentos||"").split(",").map(x=>x.trim()).filter(Boolean);
function salvaCli(){cli.nome=$("#nome")?.value||cli.nome;cli.tel=$("#tel")?.value||cli.tel;if($("#rua"))cli.end={rua:$("#rua").value,num:$("#numero").value,bairro:$("#bairro").value,comp:$("#comp").value,ref:$("#ref").value};localStorage.setItem("cli",JSON.stringify(cli))}
function render(){
 if($("#nome"))salvaCli();
 const ab=aberto();$("#st").className="st "+(ab?"on":"off");$("#st").textContent=ab?`Aberto agora · até ${M.fecha}`:`Fechado · ${M.abre} às ${M.fecha}`;
 if(view=="login")return login();if(view=="admin")return admin();
 const pr=M.precos||{},ops=M.opcoes||[];
 const mar=ops.length?`<h2>1. Escolha o tamanho</h2><div class="row">${["P","M","G"].map(t=>`<button class="${tam==t?"":"s"}" onclick="tam='${t}';render()">${TN[t]}<br>${R(pr[t])}</button>`).join("")}</div><h2>2. Escolha a opção do dia</h2>`+ops.map((m,i)=>`<div class="c">${m.esgotado?'<span class="tag">ESGOTADO</span>':""}${m.foto?`<img src="${m.foto}">`:""}<b>${esc(m.nome)}</b><div>${esc(m.desc)}</div><div class="row"><button ${m.esgotado||!tam?"disabled":""} onclick="addM(${i})">${tam?"Adicionar ao pedido":"Escolha o tamanho acima"}</button></div></div>`).join(""):'<h2>Opções do dia</h2><div class="c">Cardápio do dia em breve.</div>';
 const extra=CATS.map(([k,t])=>{const a=M[k]||[];return a.length?`<h2>${t}</h2>`+a.map((b,i)=>`<div class="c q"><div style="display:flex;align-items:center;gap:10px;flex:1">${b.foto?`<img class="bi" src="${b.foto}">`:""}<span><b>${esc(b.nome)}</b> · ${R(b.preco)}${b.desc?`<br><small>${esc(b.desc)}</small>`:""}</span></div><button ${b.esgotado?"disabled":""} onclick="addX('${k}',${i})">${b.esgotado?"Esgotado":"+"}</button></div>`).join(""):""}).join("");
 const beb=M.bebidas.map((b,i)=>`<div class="c q"><div style="display:flex;align-items:center;gap:10px;flex:1">${b.foto?`<img class="bi" src="${b.foto}">`:""}<span>${esc(b.nome)} · ${R(b.preco)}</span></div><button ${b.esgotado?"disabled":""} onclick="addB(${i})">${b.esgotado?"Esgotado":"+"}</button></div>`).join("");
 const itens=Object.entries(cart).map(([k,i])=>`<div class="q"><span>${i.q}x ${esc(i.nome)}</span><span>${R(i.q*i.preco)} <button class="s" onclick="mud('${k}',-1)">−</button> <button class="s" onclick="mud('${k}',1)">+</button></span></div>`).join("");
 const ea=typeof cli.end=="object"&&cli.end?cli.end:{};const sv=ea.rua&&!editEnd;
 const pg=pgs(),pn=pg[pag]||"";
 const f=!Object.keys(cart).length?"":`<h2>Seu pedido</h2><div class="c">${itens}<div class="q"><span>Subtotal</span><span>${R(sub())}</span></div>${modo=="entrega"?`<div class="q"><span>Taxa de entrega</span><span>${R(taxa())}</span></div>`:""}<b>Total: ${R(sub()+taxa())}</b></div>
 <h2>Seus dados</h2><div class="c">${L("nome","Nome",cli.nome)}${L("tel","Telefone (WhatsApp)",cli.tel,"tel")}
 <div class="row"><label class="rd"><input type="radio" name="m" ${modo=="retirada"?"checked":""} onchange="modo='retirada';render()"> Retirar</label><label class="rd"><input type="radio" name="m" ${modo=="entrega"?"checked":""} onchange="modo='entrega';render()"> Entrega</label></div>
 ${modo=="entrega"?(sv?`<p>📍 ${esc(endTxt(ea))}</p><button class="s" onclick="salvaCli();editEnd=true;render()">Trocar endereço</button>`:L("rua","Rua",ea.rua)+L("numero","Número",ea.num)+L("bairro","Bairro",ea.bairro)+L("comp","Complemento (apto, bloco...)",ea.comp)+L("ref","Ponto de referência",ea.ref))+`<p>🛵 Taxa de entrega: <b>${R(M.taxa)}</b></p>`:""}
 <label class="f">Observações<textarea oninput="obs=this.value">${esc(obs)}</textarea></label></div>
 <h2>Forma de pagamento</h2><div class="c">${pg.map((p,i)=>`<label class="rd"><input type="radio" name="pg" ${pag==i?"checked":""} onchange="pag=${i};render()"> ${esc(p)}</label>`).join("")}
 ${/dinheiro/i.test(pn)?`<label class="f">Troco para quanto?<input value="${esc(troco)}" oninput="troco=this.value"></label>`:""}${/pix/i.test(pn)&&M.pix?`<p>Chave Pix: <b>${esc(M.pix)}</b></p>`:""}</div>
 ${modo=="retirada"?`<h2>Retirada no local</h2><div class="c">📍 ${esc(M.endereco)}<div class="row"><a class="btn s" target="_blank" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(M.endereco)}">Como chegar</a></div></div>`:""}`;
 $("#app").innerHTML=`${mar}${extra}<h2>Bebidas</h2>${beb}${f}<p style="text-align:center"><a href="#" onclick="view=user?'admin':'login';E=JSON.parse(JSON.stringify(M));render();return false">Área do dono</a></p>`;
 $("#bar").innerHTML=Object.keys(cart).length?`<button ${ab?"":"disabled"} onclick="enviar()">${ab?`Enviar pedido pelo WhatsApp · ${R(sub()+taxa())}`:"Fechado no momento"}</button>`:"";
}
function enviar(){
 salvaCli();
 if(!cli.nome||!cli.tel)return alert("Preencha nome e telefone.");
 if(modo=="entrega"&&!(cli.end&&cli.end.rua&&cli.end.num&&cli.end.bairro))return alert("Preencha rua, número e bairro.");
 const pn=pgs()[pag];if(!pn)return alert("Escolha a forma de pagamento.");
 const l=["*Novo pedido - Bruna Tavares Marmita*","",`Nome: ${cli.nome}`,`Telefone: ${cli.tel}`,modo=="entrega"?`Entrega: ${endTxt(cli.end)}`:"Retirada no local","",
 ...Object.values(cart).map(i=>`${i.q}x ${i.nome} - ${R(i.q*i.preco)}`),"",`Subtotal: ${R(sub())}`];
 if(modo=="entrega")l.push(`Taxa de entrega: ${R(taxa())}`);
 l.push(`*Total: ${R(sub()+taxa())}*`,"",`Pagamento: ${pn}${/dinheiro/i.test(pn)&&troco?" (troco para "+troco+")":""}`);
 if(obs)l.push("",`Obs: ${obs}`);
 const u=`https://wa.me/${M.whatsapp}?text=${encodeURIComponent(l.join("\n"))}`;
 if(!window.open(u,"_blank"))location.href=u;
}
function login(){$("#bar").innerHTML="";$("#app").innerHTML=`<h2>Área do dono</h2><div class="c">${L("em","E-mail","","email")}${L("pw","Senha","","password")}
<div class="row"><button onclick="entrar()">Entrar</button><button class="s" onclick="view='loja';render()">Voltar</button></div><p><a href="#" onclick="reset();return false">Esqueci a senha</a></p></div>`}
function entrar(){auth.signInWithEmailAndPassword($("#em").value,$("#pw").value).then(()=>{view="admin";E=JSON.parse(JSON.stringify(M));render()}).catch(()=>alert("E-mail ou senha incorretos."))}
function reset(){const e=$("#em").value;if(!e)return alert("Digite seu e-mail primeiro.");auth.sendPasswordResetEmail(e).then(()=>alert("Enviamos um e-mail para criar uma nova senha.")).catch(()=>alert("Não foi possível enviar. Confira o e-mail."))}
const fld=(x,v,ph,t="text")=>`<label class="f">${ph}<input type="${t}" ${t=="number"?'step="0.01"':""} value="${esc(v)}" oninput="${x}=${t=="number"?"+this.value":"this.value"}"></label>`;
const chk=(x,v)=>`<label class="rd"><input type="checkbox" ${v?"checked":""} onchange="${x}=this.checked"> Esgotado</label>`;
function admin(){$("#bar").innerHTML="";const o=E.opcoes;
 const adc=CATS.map(([k,t,ph,bt])=>{E[k]=E[k]||[];return `<h2>${t} (até 30)</h2>`+E[k].map((b,i)=>`<div class="c">${b.foto?`<img class="bi" src="${b.foto}">`:""}${fld(`E.${k}[${i}].nome`,b.nome,ph)}${fld(`E.${k}[${i}].desc`,b.desc,"Descrição (opcional)")}${fld(`E.${k}[${i}].preco`,b.preco,"Preço (cada)","number")}<label class="f">Foto<input type="file" accept="image/*" onchange="foto(this,${i},'${k}')"></label>${chk(`E.${k}[${i}].esgotado`,b.esgotado)}<div class="row"><button class="r" onclick="E.${k}.splice(${i},1);admin()">Remover</button></div></div>`).join("")+(E[k].length<30?`<button class="s" onclick="E.${k}.push({id:'${k[0]}'+Date.now(),nome:'',desc:'',preco:0,esgotado:false});admin()">${bt}</button>`:"")}).join("");
 $("#app").innerHTML=`<h2>Preço por tamanho</h2><div class="c">${["P","M","G"].map(t=>fld(`E.precos.${t}`,E.precos[t],"Marmita "+TN[t],"number")).join("")}</div>
 <h2>Opções do dia (até 15)</h2>`+o.map((m,i)=>`<div class="c">${m.foto?`<img src="${m.foto}">`:""}${fld(`E.opcoes[${i}].nome`,m.nome,"Nome da opção")}${fld(`E.opcoes[${i}].desc`,m.desc,"Descrição / acompanhamentos")}
 <label class="f">Foto<input type="file" accept="image/*" onchange="foto(this,${i})"></label>${chk(`E.opcoes[${i}].esgotado`,m.esgotado)}<div class="row"><button class="r" onclick="E.opcoes.splice(${i},1);admin()">Remover</button></div></div>`).join("")+
 (o.length<15?`<button class="s" onclick="E.opcoes.push({id:'m'+Date.now(),nome:'',desc:'',esgotado:false});admin()">+ Opção</button>`:"")+adc+
 `<h2>Bebidas</h2>`+E.bebidas.map((b,i)=>`<div class="c">${b.foto?`<img class="bi" src="${b.foto}">`:""}${fld(`E.bebidas[${i}].nome`,b.nome,"Bebida")}${fld(`E.bebidas[${i}].preco`,b.preco,"Preço","number")}<label class="f">Foto<input type="file" accept="image/*" onchange="foto(this,${i},'bebidas')"></label>${chk(`E.bebidas[${i}].esgotado`,b.esgotado)}<div class="row"><button class="r" onclick="E.bebidas.splice(${i},1);admin()">Remover</button></div></div>`).join("")+
 `<button class="s" onclick="E.bebidas.push({id:'b'+Date.now(),nome:'',preco:0,esgotado:false});admin()">+ Bebida</button>
 <h2>Entrega e pagamento</h2><div class="c">${fld("E.taxa",E.taxa,"Taxa de entrega (R$)","number")}${fld("E.pagamentos",E.pagamentos,"Formas de pagamento (separe por vírgula)")}${fld("E.pix",E.pix,"Chave Pix (opcional)")}</div>
 <h2>Configurações</h2><div class="c">${fld("E.whatsapp",E.whatsapp,"WhatsApp com 55 + DDD")}${fld("E.endereco",E.endereco,"Endereço")}${fld("E.abre",E.abre,"Abre (ex: 10:30)")}${fld("E.fecha",E.fecha,"Fecha (ex: 13:30)")}</div>
 <div class="row"><button onclick="salvar()">Salvar tudo</button><button class="s" onclick="view='loja';render()">Ver site</button><button class="r" onclick="auth.signOut()">Sair</button></div>`}
function salvar(){ref.set(E).then(()=>alert("Salvo! O cardápio já está atualizado.")).catch(e=>alert("Erro ao salvar: "+e.message))}
function foto(inp,i,k="opcoes"){const f=inp.files[0];if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement("canvas"),s=Math.min(1,(k=="opcoes"?480:240)/im.width);c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);E[k][i].foto=c.toDataURL("image/jpeg",.6);admin()};im.src=URL.createObjectURL(f)}
render();
</script></body></html>
