<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bruna Marmita</title>
<style>
:root{--a:#0b57d0;--bg:#eef3fb;--t:#12233d}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--t);padding-bottom:90px}
header{background:var(--a);color:#fff;padding:16px;text-align:center}
header h1{margin:0;font-size:24px}.st{display:inline-block;margin-top:6px;padding:3px 12px;border-radius:99px;font-size:13px;font-weight:700}
.on{background:#1db954}.off{background:#d93025}
main{max-width:640px;margin:auto;padding:12px}
h2{margin:18px 0 8px;color:var(--a)}
.c{background:#fff;border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 1px 4px #0002;position:relative}
.c img{width:100%;max-height:200px;object-fit:cover;border-radius:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
button,.btn{background:var(--a);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-size:15px;font-weight:600;text-decoration:none;display:inline-block;cursor:pointer}
button.s{background:#fff;color:var(--a);border:2px solid var(--a)}button.r{background:#d93025}button:disabled{background:#999;cursor:not-allowed}
input,textarea{width:100%;padding:10px;margin:4px 0;border:1px solid #bbc;border-radius:8px;font-size:15px}
input[type=checkbox]{width:auto}label{font-size:14px}
.tag{position:absolute;top:18px;right:18px;background:#d93025;color:#fff;padding:4px 10px;border-radius:8px;font-weight:700}
.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:10px;box-shadow:0 -2px 8px #0003;text-align:center}
.bar button{width:100%;max-width:640px}
.q{display:flex;align-items:center;gap:10px;justify-content:space-between;margin:6px 0}
.q button{padding:4px 12px}
</style></head><body>
<header><h1>🍱 Bruna Marmita</h1><div id="st" class="st"></div></header>
<div style="background:#fff3cd;color:#664d03;padding:8px;text-align:center;font-size:13px">PRÉVIA: dados de teste. Na área do dono, entre com qualquer e-mail e senha.</div><main id="app"></main><div id="bar" class="bar"></div>
<script>
window.firebase={initializeApp(){},auth:()=>({onAuthStateChanged(f){window._af=f;f(null)},signInWithEmailAndPassword(){setTimeout(()=>window._af({}));return Promise.resolve()},signOut(){window._af(null)}}),firestore:()=>({doc:()=>({onSnapshot(f){window._sf=f;f({exists:false})},set(d){window._sf({exists:true,data:()=>d});return Promise.resolve()}})})};
</script>
<script>
const FB={apiKey:"COLE_AQUI",authDomain:"COLE_AQUI",projectId:"COLE_AQUI",appId:"COLE_AQUI"};
firebase.initializeApp(FB);
const auth=firebase.auth(),ref=firebase.firestore().doc("config/menu");
const DEF={marmitas:[],bebidas:[
{id:"b1",nome:"Coca-Cola 2L",preco:14,esgotado:false},{id:"b2",nome:"Guariti 2L",preco:10,esgotado:false},
{id:"b3",nome:"Coca-Cola lata",preco:6,esgotado:false},{id:"b4",nome:"Guaraná lata",preco:6,esgotado:false},
{id:"b5",nome:"Água",preco:3,esgotado:false}],
whatsapp:"5517991337756",endereco:"R. Cristóvão Colombo, 1460 - Vila Maceno, São José do Rio Preto - SP, 15055-000",abre:"00:00",fecha:"23:59"};
let M=DEF,E=null,cart={},view="loja",user=null,editEnd=false,modo="retirada";
let cli=JSON.parse(localStorage.getItem("cli")||"{}");
const $=s=>document.querySelector(s),R=n=>"R$ "+Number(n||0).toFixed(2).replace(".",",");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const endTxt=e=>e&&e.rua?`${e.rua}, ${e.num} - ${e.bairro}${e.comp?" ("+e.comp+")":""}${e.ref?" | Ref: "+e.ref:""}`:"";
const aberto=()=>{const d=new Date(),m=d.getHours()*60+d.getMinutes(),p=h=>{const[a,b]=h.split(":");return a*60+ +b};return m>=p(M.abre)&&m<=p(M.fecha)};
ref.onSnapshot(d=>{M=d.exists?{...DEF,...d.data()}:DEF;if(view!="admin")render()},()=>render());
auth.onAuthStateChanged(u=>{user=u;if(!u&&view=="admin")view="loja";render()});
function add(k,nome,preco){cart[k]=cart[k]||{nome,preco,q:0};cart[k].q++;render()}
function mud(k,d){cart[k].q+=d;if(cart[k].q<1)delete cart[k];render()}
const total=()=>Object.values(cart).reduce((s,i)=>s+i.q*i.preco,0);
function salvaCli(){cli.nome=$("#nome")?.value||cli.nome;cli.tel=$("#tel")?.value||cli.tel;if($("#rua"))cli.end={rua:$("#rua").value,num:$("#numero").value,bairro:$("#bairro").value,comp:$("#comp").value,ref:$("#ref").value};localStorage.setItem("cli",JSON.stringify(cli))}
function render(){
 if($("#nome"))salvaCli();const ab=aberto();$("#st").className="st "+(ab?"on":"off");$("#st").textContent=ab?`Aberto agora · até ${M.fecha}`:`Fechado · ${M.abre} às ${M.fecha}`;
 if(view=="login")return login();if(view=="admin")return admin();
 const mar=M.marmitas.map(m=>`<div class="c">${m.esgotado?'<span class="tag">ESGOTADO</span>':""}${m.foto?`<img src="${m.foto}">`:""}
 <b>${esc(m.nome)}</b><div>${esc(m.desc)}</div><div class="row">${["P","M","G"].map(t=>`<button ${m.esgotado?"disabled":""} onclick="add('${m.id}${t}','${esc(m.nome)} (${t})',${m.precos?.[t]||0})">${{P:"Pequena",M:"Média",G:"Grande"}[t]} ${R(m.precos?.[t])}</button>`).join("")}</div></div>`).join("")||'<div class="c">Cardápio do dia em breve.</div>';
 const beb=M.bebidas.map(b=>`<div class="c q"><span>${esc(b.nome)} · ${R(b.preco)}</span><button ${b.esgotado?"disabled":""} onclick="add('${b.id}','${esc(b.nome)}',${b.preco})">${b.esgotado?"Esgotado":"+"}</button></div>`).join("");
 const itens=Object.entries(cart).map(([k,i])=>`<div class="q"><span>${i.q}x ${i.nome}</span><span>${R(i.q*i.preco)} <button class="s" onclick="mud('${k}',-1)">−</button> <button class="s" onclick="mud('${k}',1)">+</button></span></div>`).join("");
 const ea=typeof cli.end=="object"&&cli.end?cli.end:{};const sv=ea.rua&&!editEnd;
 const f=!Object.keys(cart).length?"":`<h2>Seu pedido</h2><div class="c">${itens}<b>Total: ${R(total())}</b></div>
 <h2>Seus dados</h2><div class="c"><input id="nome" placeholder="Nome" value="${esc(cli.nome)}"><input id="tel" type="tel" placeholder="Telefone" value="${esc(cli.tel)}">
 <div class="row"><label><input type="radio" name="m" ${modo=="retirada"?"checked":""} onchange="modo='retirada';render()"> Retirar</label><label><input type="radio" name="m" ${modo=="entrega"?"checked":""} onchange="modo='entrega';render()"> Entrega</label></div>
 ${modo=="entrega"?(sv?`<p>📍 ${esc(endTxt(ea))}</p><button class="s" onclick="salvaCli();editEnd=true;render()">Trocar endereço</button>`:`<input id="rua" placeholder="Rua" value="${esc(ea.rua)}"><input id="numero" placeholder="Número" value="${esc(ea.num)}"><input id="bairro" placeholder="Bairro" value="${esc(ea.bairro)}"><input id="comp" placeholder="Complemento (apto, bloco...)" value="${esc(ea.comp)}"><input id="ref" placeholder="Ponto de referência" value="${esc(ea.ref)}">`):`<p>Retirada em: ${esc(M.endereco)}</p>`}
 <textarea id="obs" placeholder="Observações (ex: sem feijão)"></textarea></div>`;
 $("#app").innerHTML=`<div class="c">📍 ${esc(M.endereco)}<div class="row"><a class="btn s" target="_blank" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(M.endereco)}">Como chegar</a></div></div>
 <h2>Marmitas do dia</h2>${mar}<h2>Bebidas</h2>${beb}${f}<p style="text-align:center"><a href="#" onclick="view=user?'admin':'login';E=JSON.parse(JSON.stringify(M));render();return false">Área do dono</a></p>`;
 $("#bar").innerHTML=Object.keys(cart).length?`<button ${ab?"":"disabled"} onclick="enviar()">${ab?`Enviar pedido pelo WhatsApp · ${R(total())}`:"Fechado no momento"}</button>`:"";
}
function enviar(){
 salvaCli();
 if(!cli.nome||!cli.tel)return alert("Preencha nome e telefone.");
 if(modo=="entrega"&&!(cli.end&&cli.end.rua&&cli.end.num&&cli.end.bairro))return alert("Preencha rua, número e bairro.");
 const l=["*Novo pedido - Bruna Marmita*","",`Nome: ${cli.nome}`,`Telefone: ${cli.tel}`,modo=="entrega"?`Entrega: ${endTxt(cli.end)}`:"Retirada no local","",
 ...Object.values(cart).map(i=>`${i.q}x ${i.nome} - ${R(i.q*i.preco)}`),"",`*Total: ${R(total())}*`];
 const o=$("#obs")?.value;if(o)l.push("",`Obs: ${o}`);
 const u=`https://wa.me/${M.whatsapp}?text=${encodeURIComponent(l.join("\n"))}`;
 if(!window.open(u,"_blank"))location.href=u;
}
function login(){$("#bar").innerHTML="";$("#app").innerHTML=`<h2>Área do dono</h2><div class="c"><input id="em" type="email" placeholder="E-mail"><input id="pw" type="password" placeholder="Senha">
<div class="row"><button onclick="entrar()">Entrar</button><button class="s" onclick="view='loja';render()">Voltar</button></div></div>`}
function entrar(){auth.signInWithEmailAndPassword($("#em").value,$("#pw").value).then(()=>{view="admin";E=JSON.parse(JSON.stringify(M));render()}).catch(()=>alert("E-mail ou senha incorretos."))}
const fld=(x,v,ph,t="text")=>`<input type="${t}" ${t=="number"?'step="0.01"':""} placeholder="${ph}" value="${esc(v)}" oninput="${x}=${t=="number"?"+this.value":"this.value"}">`;
const chk=(x,v)=>`<label><input type="checkbox" ${v?"checked":""} onchange="${x}=this.checked"> Esgotado</label>`;
function admin(){$("#bar").innerHTML="";
 $("#app").innerHTML=`<h2>Marmitas do dia</h2>`+E.marmitas.map((m,i)=>`<div class="c">${m.foto?`<img src="${m.foto}">`:""}${fld(`E.marmitas[${i}].nome`,m.nome,"Nome do prato")}${fld(`E.marmitas[${i}].desc`,m.desc,"Descrição / acompanhamentos")}
 ${["P","M","G"].map(t=>fld(`E.marmitas[${i}].precos.${t}`,m.precos?.[t],"Preço "+{P:"Pequena",M:"Média",G:"Grande"}[t],"number")).join("")}
 <input type="file" accept="image/*" onchange="foto(this,${i})">${chk(`E.marmitas[${i}].esgotado`,m.esgotado)}<div class="row"><button class="r" onclick="E.marmitas.splice(${i},1);admin()">Remover</button></div></div>`).join("")+
 `<button class="s" onclick="E.marmitas.push({id:'m'+Date.now(),nome:'',desc:'',precos:{P:0,M:0,G:0},esgotado:false});admin()">+ Marmita</button>
 <h2>Bebidas</h2>`+E.bebidas.map((b,i)=>`<div class="c">${fld(`E.bebidas[${i}].nome`,b.nome,"Bebida")}${fld(`E.bebidas[${i}].preco`,b.preco,"Preço","number")}${chk(`E.bebidas[${i}].esgotado`,b.esgotado)}<div class="row"><button class="r" onclick="E.bebidas.splice(${i},1);admin()">Remover</button></div></div>`).join("")+
 `<button class="s" onclick="E.bebidas.push({id:'b'+Date.now(),nome:'',preco:0,esgotado:false});admin()">+ Bebida</button>
 <h2>Configurações</h2><div class="c">${fld("E.whatsapp",E.whatsapp,"WhatsApp com 55+DDD")}${fld("E.endereco",E.endereco,"Endereço")}${fld("E.abre",E.abre,"Abre (10:30)")}${fld("E.fecha",E.fecha,"Fecha (13:30)")}</div>
 <div class="row"><button onclick="salvar()">Salvar tudo</button><button class="s" onclick="view='loja';render()">Ver site</button><button class="r" onclick="auth.signOut()">Sair</button></div>`}
function salvar(){ref.set(E).then(()=>alert("Salvo! O cardápio já está atualizado.")).catch(e=>alert("Erro ao salvar: "+e.message))}
function foto(inp,i){const f=inp.files[0];if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement("canvas"),s=Math.min(1,700/im.width);c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);E.marmitas[i].foto=c.toDataURL("image/jpeg",.7);admin()};im.src=URL.createObjectURL(f)}
render();
</script></body></html>
